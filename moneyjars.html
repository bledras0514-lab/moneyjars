<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap');

.mj-entry-cat { font-weight: 700; flex-shrink: 0; min-width: 32px; }

.mj-mini-btn {

}

.mj-entry-form input.mj-amt-input,
.mj-entry-form input[type="text"] {

}

}
</style>

<div class="moneyjars-app">
  <header class="mj-top">
    <div class="mj-brand">
      <h1>돈항아리</h1>
      <p class="mj-tagline">25 · 50 · 15 · 10 법칙으로 굴리는 나의 곳간</p>
    </div>
    <div class="mj-stamp">재테크<br>장독대</div>
  </header>

  <section id="mjCapitalCard" class="mj-panel"></section>

  <section id="mjIncomeCard" class="mj-panel"></section>

  <section class="mj-jars-row" id="mjJarsRow"></section>

  <section class="mj-panel">
    <div class="mj-cal-header" id="mjCalHeader"></div>
    <div class="mj-cal-grid" id="mjCalGrid"></div>
    <div class="mj-legend" id="mjLegend"></div>
  </section>

  <section class="mj-panel" id="mjDayPanel"></section>

  <button class="mj-reset-btn" id="mjResetBtn">전체 데이터 초기화</button>
</div>

<script>
(function(){
  const STORAGE_KEY = 'moneyjars_v1';

  const CATS = [
    { key:'youth',     label:'청년적금', mode:'fixed',   color:'#35618C', soft:'#DCE6EF', note:'청년도약계좌 자동이체 · 완료 체크하면 자본에 더해짐' },
    { key:'fixedcost', label:'고정비',   mode:'fixed',   color:'#B9812B', soft:'#F1E4C9', note:'구독료·교통비 등 · 완료 체크하면 자본(저축)에서 빠짐' },
    { key:'growth',    label:'성장(ISA)', mode:'pct', pct:25, color:'#1E6E52', soft:'#DCEDE3', note:'적금·고정비 뺀 나머지의 25% · 완료 체크하면 자본에 더해짐' },
    { key:'saving',    label:'저축',     mode:'pct', pct:75, color:'#7A4A5C', soft:'#EFDDE3', note:'적금·고정비 뺀 나머지의 75% · 완료 체크하면 자본에 더해짐' }
  ];

  const JAR_PATH = "M100,8 C122,8 138,18 138,34 C138,44 132,50 128,56 C160,72 182,108 182,150 C182,205 148,252 100,252 C52,252 18,205 18,150 C18,108 40,72 72,56 C68,50 62,44 62,34 C62,18 78,8 100,8 Z";

  let state = null;
  let selectedDate = null;
  let entryFormVisible = false;
  let editingEntryId = null;
  let entryFormType = 'expense';
  let incomeFormOpen = false;

  function pad2(n){ return String(n).padStart(2,'0'); }
  function ymOf(y,m){ return y + '-' + pad2(m+1); }
  function keyOf(y,m,d){ return ymOf(y,m) + '-' + pad2(d); }
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  function firstWeekday(y,m){ return new Date(y, m, 1).getDay(); }
  function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function formatWon(n){
    const sign = n < 0 ? '-' : '';
    return sign + Math.round(Math.abs(n)).toLocaleString('ko-KR') + '원';
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function toDigits(str){ return String(str || '').replace(/[^0-9]/g, ''); }
  function fmtPlain(n){ return (n || n === 0) && n !== '' ? Number(n).toLocaleString('ko-KR') : ''; }
  function getAmt(id){
    const el = document.getElementById(id);
    return el ? (Number(toDigits(el.value)) || 0) : 0;
  }
  function bindAmtInputs(ids){
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', () => {
        const digits = toDigits(el.value);
        el.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
      });
    });
  }
  // 지출 기록 금액은 마이너스(환급·차감)도 입력 가능해야 해서 부호를 살려주는 버전
  function toDigitsSigned(str){
    const s = String(str || '');
    const neg = /^\s*-/.test(s);
    const digits = s.replace(/[^0-9]/g, '');
    return (neg && digits) ? '-' + digits : digits;
  }
  function fmtPlainSigned(n){
    if (n === '' || n == null || isNaN(Number(n))) return '';
    const num = Number(n);
    return (num < 0 ? '-' : '') + Math.abs(num).toLocaleString('ko-KR');
  }
  function getSignedAmt(id){
    const el = document.getElementById(id);
    if (!el) return 0;
    const raw = toDigitsSigned(el.value);
    return raw ? Number(raw) : 0;
  }
  function bindSignedAmtInput(id){
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input', () => {
      const raw = toDigitsSigned(el.value);
      el.value = raw ? fmtPlainSigned(raw) : '';
    });
  }

  async function loadState(){
    try {
      const res = await window.storage.get(STORAGE_KEY, false);
      if (res && res.value) {
        const parsed = JSON.parse(res.value);
        const today = new Date();
        const merged = Object.assign({
          incomeSettings: {},
          capital: null,
          entries: {},
          view: { y: today.getFullYear(), m: today.getMonth() }
        }, parsed);
        // 예전 방식(단일 incomeSetting) 데이터가 있으면 그 달 하나로 옮겨줌
        if (parsed && parsed.incomeSetting && !merged.incomeSettings[parsed.incomeSetting.startYM]) {
          const old = parsed.incomeSetting;
          merged.incomeSettings[old.startYM] = { amount: old.amount, youthSaving: old.youthSaving, fixedCost: old.fixedCost };
        }
        delete merged.incomeSetting;
        return merged;
      }
    } catch(e) { /* 저장된 데이터 없음 - 기본값 사용 */ }
    const today = new Date();
    return { incomeSettings: {}, capital: null, entries: {}, view: { y: today.getFullYear(), m: today.getMonth() } };
  }

  async function saveState(){
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    } catch(e) { console.error('저장 실패', e); }
  }

  function activeSettingForYM(ym){
    return (state.incomeSettings && state.incomeSettings[ym]) || null;
  }

  function computeCategoryStats(ym){
    const active = activeSettingForYM(ym);
    const incomeAmt = active ? active.amount : 0;
    const youthAmt = active ? (Number(active.youthSaving) || 0) : 0;
    const fixedAmt = active ? (Number(active.fixedCost) || 0) : 0;
    const remainder = Math.max(0, incomeAmt - youthAmt - fixedAmt);
    const baseAlloc = { youth: youthAmt, fixedcost: fixedAmt, growth: remainder * 0.25, saving: remainder * 0.75 };

    const stats = {};
    CATS.forEach(c => stats[c.key] = { allocated: baseAlloc[c.key] || 0, extraIncome: 0, spent: 0 });

    Object.keys(state.entries).forEach(dateKey => {
      if (dateKey.indexOf(ym) !== 0) return;
      state.entries[dateKey].forEach(e => {
        if (!stats[e.category]) return;
        if (e.isIncome) stats[e.category].extraIncome += Number(e.amount) || 0;
        else stats[e.category].spent += Number(e.amount) || 0;
      });
    });

    CATS.forEach(c => {
      const s = stats[c.key];
      s.available = s.allocated + s.extraIncome;
      s.remaining = s.available - s.spent;
      s.ratio = s.available > 0 ? (s.remaining / s.available) : (s.remaining < 0 ? -1 : 0);
      s.overflow = s.remaining < 0;
    });
    return stats;
  }

  /* ---------- 자본 카드 (ISA 연 5% 실시간 성장) ---------- */
  let capitalFormOpen = false;
  let capitalTickerId = null;
  const ISA_RATE = 0.05;

  function computeCapitalNow(){
    if (!state.capital) return { youthNow: 0, isaNow: 0, savingNow: 0, isaPrincipalSum: 0, total: 0 };
    const nowMs = Date.now();
    const asOfMs = new Date(state.capital.asOf).getTime();
    const asOfDateStr = state.capital.asOf.slice(0, 10);
    const YEAR_MS = 1000 * 60 * 60 * 24 * 365;

    let isaNow = (state.capital.isaBalance || 0) * Math.pow(1 + ISA_RATE, Math.max(0, nowMs - asOfMs) / YEAR_MS);
    let isaPrincipalSum = state.capital.isaBalance || 0;
    let youthNow = state.capital.youthBalance || 0;
    let savingNow = state.capital.savingBalance || 0;

    // 딱 하나의 규칙: 달력에서 "완료" 체크한 지출/이체만 자본을 움직인다.
    // 청년적금·성장(ISA)·저축 = 그 계좌로 실제 들어간 돈 → 자본에 더해짐
    // 고정비 = 실제로 나가서 없어진 돈 → 자본(저축)에서 빠짐 (수입 유무와 무관)
    Object.keys(state.entries).forEach(dateKey => {
      if (dateKey < asOfDateStr) return; // 자본 입력 이전 기록은 이미 잔액에 반영된 것으로 봄
      state.entries[dateKey].forEach(e => {
        if (e.isIncome || !e.checked) return;
        const amt = Number(e.amount) || 0;
        if (e.category === 'youth') {
          youthNow += amt;
        } else if (e.category === 'saving') {
          savingNow += amt;
        } else if (e.category === 'growth') {
          isaPrincipalSum += amt;
          const entryMs = new Date(dateKey + 'T00:00:00').getTime();
          const yrs = Math.max(0, nowMs - entryMs) / YEAR_MS;
          isaNow += amt * Math.pow(1 + ISA_RATE, yrs);
        } else if (e.category === 'fixedcost') {
          savingNow -= amt;
        }
      });
    });

    return { youthNow, isaNow, savingNow, isaPrincipalSum, total: youthNow + isaNow + savingNow };
  }

  function fmtDecimal(n){
    const sign = n < 0 ? '-' : '+';
    return sign + Math.abs(n).toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderCapitalCard(){
    const container = document.getElementById('mjCapitalCard');
    if (capitalFormOpen || !state.capital) {
      const c = state.capital || { youthBalance:'', isaBalance:'', savingBalance:'' };
      container.innerHTML =
        '<div class="mj-income-form">' +
          '<div class="mj-label">현재 내 자본을 입력해주세요 (통장·앱에서 확인한 실제 잔액)</div>' +
          '<label class="mj-field">청년적금 현재 잔액 (원)<input type="text" inputmode="numeric" class="mj-amt-input" id="mjCapYouth" placeholder="예: 10,950,000" value="' + fmtPlain(c.youthBalance) + '"></label>' +
          '<label class="mj-field">ISA 현재 잔액 (원)<input type="text" inputmode="numeric" class="mj-amt-input" id="mjCapIsa" placeholder="예: 6,976,376" value="' + fmtPlain(c.isaBalance) + '"></label>' +
          '<label class="mj-field">저축(현금) 현재 잔액 (원)<input type="text" inputmode="numeric" class="mj-amt-input" id="mjCapSaving" placeholder="예: 3,500,000" value="' + fmtPlain(c.savingBalance) + '"></label>' +
          '<div class="mj-period-desc">저장하는 순간부터 ISA는 연 5% 복리로 자동으로 불어나요</div>' +
          '<button class="mj-btn-save" id="mjSaveCapitalBtn">저장</button>' +
        '</div>';
      bindAmtInputs(['mjCapYouth', 'mjCapIsa', 'mjCapSaving']);
      document.getElementById('mjSaveCapitalBtn').onclick = () => {
        const youthBalance = getAmt('mjCapYouth');
        const isaBalance = getAmt('mjCapIsa');
        const savingBalance = getAmt('mjCapSaving');
        state.capital = { youthBalance, isaBalance, savingBalance, asOf: new Date().toISOString() };
        capitalFormOpen = false;
        saveState();
        renderCapitalCard();
      };
    } else {
      const cap = computeCapitalNow();
      const delta = cap.isaNow - cap.isaPrincipalSum;
      container.innerHTML =
        '<div class="mj-capital-summary">' +
          '<div class="mj-capital-label">현재 내 자본 (실시간 · 달력 기록 반영)</div>' +
          '<div class="mj-capital-total" id="mjCapTotalDisplay">' + formatWon(cap.total) + '</div>' +
          '<div class="mj-capital-delta" id="mjCapDeltaDisplay">ISA 이자로 ' + fmtDecimal(delta) + '원 불어남</div>' +
          '<div class="mj-capital-breakdown">' +
            '<div class="mj-capital-item"><div class="k">청년적금</div><div class="v" id="mjCapYouthDisplay">' + formatWon(cap.youthNow) + '</div></div>' +
            '<div class="mj-capital-item"><div class="k">ISA (연 5%)</div><div class="v" id="mjCapIsaDisplay">' + formatWon(cap.isaNow) + '</div></div>' +
            '<div class="mj-capital-item"><div class="k">저축</div><div class="v" id="mjCapSavingDisplay">' + formatWon(cap.savingNow) + '</div></div>' +
          '</div>' +
          '<button class="mj-btn-edit" id="mjEditCapitalBtn">자본 수정</button>' +
        '</div>';
      document.getElementById('mjEditCapitalBtn').onclick = () => { capitalFormOpen = true; renderCapitalCard(); };
      startCapitalTicker();
    }
  }

  function startCapitalTicker(){
    if (capitalTickerId) clearInterval(capitalTickerId);
    capitalTickerId = setInterval(() => {
      if (!state.capital || capitalFormOpen) return;
      const cap = computeCapitalNow();
      const delta = cap.isaNow - cap.isaPrincipalSum;
      const totalEl = document.getElementById('mjCapTotalDisplay');
      const deltaEl = document.getElementById('mjCapDeltaDisplay');
      const isaEl = document.getElementById('mjCapIsaDisplay');
      const youthEl = document.getElementById('mjCapYouthDisplay');
      const savingEl = document.getElementById('mjCapSavingDisplay');
      if (totalEl) totalEl.textContent = formatWon(cap.total);
      if (deltaEl) deltaEl.textContent = 'ISA 이자로 ' + fmtDecimal(delta) + '원 불어남';
      if (isaEl) isaEl.textContent = formatWon(cap.isaNow);
      if (youthEl) youthEl.textContent = formatWon(cap.youthNow);
      if (savingEl) savingEl.textContent = formatWon(cap.savingNow);
    }, 1000);
  }

  /* ---------- 수입 카드 ---------- */
  function renderIncomeCard(){
    const container = document.getElementById('mjIncomeCard');
    const ym = ymOf(state.view.y, state.view.m);
    const ymLabel = state.view.y + '년 ' + (state.view.m + 1) + '월';

    if (incomeFormOpen) {
      const existing = state.incomeSettings[ym];
      let s;
      if (existing) {
        s = existing;
      } else {
        // 이 달에 설정이 없으면, 편의상 가장 최근 이전 달 설정값을 기본값으로 미리 채워줌 (저장 전까지는 이 달과 무관)
        const priorKeys = Object.keys(state.incomeSettings).filter(k => k < ym).sort();
        s = priorKeys.length ? state.incomeSettings[priorKeys[priorKeys.length - 1]] : { amount: '', youthSaving: 400000, fixedCost: '' };
      }
      container.innerHTML =
        '<div class="mj-income-form">' +
          '<div class="mj-label">' + ymLabel + ' 수입 (이 달에만 적용돼요)</div>' +
          '<label class="mj-field">월 수입 (원, 없으면 0)<input type="text" inputmode="numeric" class="mj-amt-input" id="mjIncAmount" placeholder="예: 1,280,000 (없으면 0)" value="' + fmtPlain(s.amount) + '"></label>' +
          '<label class="mj-field">청년적금 (원 · 고정이체)<input type="text" inputmode="numeric" class="mj-amt-input" id="mjYouthAmount" placeholder="예: 400,000" value="' + fmtPlain(s.youthSaving != null ? s.youthSaving : 400000) + '"></label>' +
          '<label class="mj-field">월 고정비 (원 · 구독료·교통비 등)<input type="text" inputmode="numeric" class="mj-amt-input" id="mjFixedAmount" placeholder="예: 269,000" value="' + fmtPlain(s.fixedCost) + '"></label>' +
          '<button class="mj-btn-save" id="mjSaveIncomeBtn">' + ymLabel + '에 저장</button>' +
        '</div>';
      bindAmtInputs(['mjIncAmount', 'mjYouthAmount', 'mjFixedAmount']);
      document.getElementById('mjSaveIncomeBtn').onclick = () => {
        const amt = getAmt('mjIncAmount');
        if (isNaN(amt) || amt < 0) { alert('0 이상의 수입 금액을 입력해주세요 (수입 없으면 0).'); return; }
        const youthAmt = getAmt('mjYouthAmount');
        const fixedAmt = getAmt('mjFixedAmount');
        state.incomeSettings[ym] = { amount: amt, youthSaving: youthAmt, fixedCost: fixedAmt };
        incomeFormOpen = false;
        saveState();
        renderIncomeCard();
        renderJars();
      };
    } else {
      const active = activeSettingForYM(ym);
      let breakdownHtml = '';
      if (active) {
        const youthAmt = Number(active.youthSaving) || 0;
        const fixedAmt = Number(active.fixedCost) || 0;
        const remainder = Math.max(0, active.amount - youthAmt - fixedAmt);
        breakdownHtml = '<div class="mj-income-breakdown">청년적금 ' + formatWon(youthAmt) + ' · 고정비 ' + formatWon(fixedAmt) + ' · 투자·저축 재원 ' + formatWon(remainder) + '</div>';
      }
      container.innerHTML =
        '<div class="mj-income-summary">' +
          '<div>' +
            '<span class="mj-label">' + ymLabel + ' 수입</span>' +
            '<div class="mj-amount">' + (active ? formatWon(active.amount) : '이 달은 아직 설정 안 함') + '</div>' +
            breakdownHtml +
          '</div>' +
          '<button class="mj-btn-edit" id="mjEditIncomeBtn">' + (active ? '수입 수정' : '이 달 수입 설정') + '</button>' +
        '</div>';
      document.getElementById('mjEditIncomeBtn').onclick = () => { incomeFormOpen = true; renderIncomeCard(); };
    }
  }

  /* ---------- 항아리 ---------- */
  function renderJars(){
    const ym = ymOf(state.view.y, state.view.m);
    const stats = computeCategoryStats(ym);
    const row = document.getElementById('mjJarsRow');
    row.innerHTML = CATS.map(c => {
      const s = stats[c.key];
      const ratio = Math.min(1, Math.max(0, s.ratio));
      const jarTop = 20, jarBottom = 252;
      const liquidH = (jarBottom - jarTop) * ratio;
      const liquidY = jarBottom - liquidH;
      const liquidColor = s.overflow ? 'var(--danger, #B23A2E)' : c.color;
      return (
        '<div class="mj-jar-card">' +
          '<div class="mj-jar-head"><span class="mj-jar-name">' + c.label + '</span><span class="mj-jar-pct mj-mono">' + (c.mode === 'fixed' ? '고정' : ('잔액 ' + c.pct + '%')) + '</span></div>' +
          '<svg viewBox="0 0 200 260" class="mj-jar-svg">' +
            '<defs><clipPath id="mjClip-' + c.key + '"><path d="' + JAR_PATH + '"/></clipPath></defs>' +
            '<path d="' + JAR_PATH + '" fill="' + c.soft + '"/>' +
            '<g clip-path="url(#mjClip-' + c.key + ')">' +
              '<rect x="0" y="' + liquidY + '" width="200" height="' + liquidH + '" fill="' + liquidColor + '"/>' +
              '<rect x="0" y="' + (liquidY - 4) + '" width="200" height="6" fill="#ffffff" opacity="0.35"/>' +
            '</g>' +
            '<path d="M35,95 C70,106 130,106 165,95" stroke="rgba(0,0,0,0.10)" stroke-width="2" fill="none"/>' +
            '<path d="M26,122 C70,135 130,135 174,122" stroke="rgba(0,0,0,0.08)" stroke-width="2" fill="none"/>' +
            '<path d="' + JAR_PATH + '" fill="none" stroke="' + c.color + '" stroke-width="3" opacity="0.85"/>' +
          '</svg>' +
          '<div class="mj-jar-amt mj-mono ' + (s.overflow ? 'over' : '') + '">' + formatWon(s.remaining) + '</div>' +
          '<div class="mj-jar-sub mj-mono">/ ' + formatWon(s.available) + '</div>' +
          '<div class="mj-jar-note">' + c.note + '</div>' +
          (c.key !== 'fixedcost' ? '<button type="button" class="mj-jar-push" data-pushcat="' + c.key + '">잔액 자본에 반영</button>' : '') +
        '</div>'
      );
    }).join('');

    row.querySelectorAll('.mj-jar-push').forEach(btn => {
      btn.onclick = () => {
        if (!state.capital) { alert('먼저 위에서 "현재 내 자본"을 설정해주세요.'); return; }
        const catKey = btn.dataset.pushcat;
        const curYm = ymOf(state.view.y, state.view.m);
        const curStats = computeCategoryStats(curYm);
        const remaining = Math.round(curStats[catKey].remaining);
        if (remaining === 0) { alert('반영할 금액이 없어요 (남은 금액 0원).'); return; }
        const now = new Date();
        const todayKey = keyOf(now.getFullYear(), now.getMonth(), now.getDate());
        if (!state.entries[todayKey]) state.entries[todayKey] = [];
        const memo = remaining < 0 ? '이번달 초과분 자본에서 차감' : '이번달 잔액 자본 반영';
        state.entries[todayKey].push({ id: uid(), isIncome: false, category: catKey, amount: remaining, memo: memo, checked: true });
        saveState();
        renderCapitalCard(); renderJars(); renderCalendar();
        if (selectedDate === todayKey) renderDayPanel();
        if (remaining < 0) alert(formatWon(-remaining) + ' 이(가) 자본에서 빠졌어요.');
        else alert(formatWon(remaining) + ' 이(가) 자본에 반영됐어요!');
      };
    });
  }

  /* ---------- 달력 ---------- */
  function changeMonth(delta){
    let { y, m } = state.view;
    m += delta;
    if (m < 0) { m = 11; y--; }
    if (m > 11) { m = 0; y++; }
    state.view = { y, m };
    selectedDate = null;
    incomeFormOpen = false;
    saveState();
    renderIncomeCard();
    renderJars();
    renderCalendar();
    renderDayPanel();
  }

  function renderCalendar(){
    const { y, m } = state.view;
    document.getElementById('mjCalHeader').innerHTML =
      '<button class="mj-cal-nav" id="mjPrevMonth" aria-label="이전 달">‹</button>' +
      '<span class="mj-cal-title">' + y + '년 ' + (m+1) + '월</span>' +
      '<button class="mj-cal-nav" id="mjNextMonth" aria-label="다음 달">›</button>';
    document.getElementById('mjPrevMonth').onclick = () => changeMonth(-1);
    document.getElementById('mjNextMonth').onclick = () => changeMonth(1);

    const weekdays = ['일','월','화','수','목','금','토'];
    let html = weekdays.map(w => '<div class="mj-wd">' + w + '</div>').join('');
    const firstWd = firstWeekday(y, m);
    const totalDays = daysInMonth(y, m);
    for (let i = 0; i < firstWd; i++) html += '<div class="mj-day-cell empty"></div>';

    const now = new Date();
    const todayKey = keyOf(now.getFullYear(), now.getMonth(), now.getDate());
    const monthStats = computeCategoryStats(ymOf(y, m));
    function fmtCompact(n){ return (n < 0 ? '-' : '+') + Math.round(Math.abs(n)).toLocaleString('ko-KR'); }

    for (let d = 1; d <= totalDays; d++) {
      const dk = keyOf(y, m, d);
      const dayEntries = state.entries[dk] || [];
      let incomeSum = 0, expenseSum = 0, overflowFlag = false;
      dayEntries.forEach(e => {
        if (e.isIncome) incomeSum += Number(e.amount) || 0;
        else {
          expenseSum += Number(e.amount) || 0;
          if (monthStats[e.category] && monthStats[e.category].overflow) overflowFlag = true;
        }
      });
      let sumsHtml = '';
      if (incomeSum > 0) sumsHtml += '<span class="mj-dsum-income">' + fmtCompact(incomeSum) + '</span>';
      if (expenseSum > 0) sumsHtml += '<span class="mj-dsum-expense' + (overflowFlag ? ' over' : '') + '">-' + Math.round(expenseSum).toLocaleString('ko-KR') + '</span>';
      const cls = ['mj-day-cell'];
      if (dk === todayKey) cls.push('today');
      if (dk === selectedDate) cls.push('selected');
      html += '<button class="' + cls.join(' ') + '" data-date="' + dk + '"><span class="mj-dnum">' + d + '</span><span class="mj-dsums">' + sumsHtml + '</span></button>';
    }
    document.getElementById('mjCalGrid').innerHTML = html;
    document.querySelectorAll('#mjCalGrid .mj-day-cell:not(.empty)').forEach(btn => {
      btn.onclick = () => {
        selectedDate = btn.dataset.date;
        entryFormVisible = false;
        editingEntryId = null;
        renderCalendar();
        renderDayPanel();
      };
    });

    document.getElementById('mjLegend').innerHTML =
      '<span class="mj-lg-item"><span class="mj-lg-dot" style="background:#2F6FB0"></span>수입</span>' +
      '<span class="mj-lg-item"><span class="mj-lg-dot" style="background:#766B5C"></span>지출</span>' +
      '<span class="mj-lg-item"><span class="mj-lg-dot" style="background:#B23A2E"></span>예산 초과 항목 포함</span>';
  }

  /* ---------- 일별 패널 ---------- */
  function renderDayPanel(){
    const panel = document.getElementById('mjDayPanel');
    if (!selectedDate) {
      panel.innerHTML = '<p class="mj-hint">날짜를 선택하면 그날의 지출·수입을 기록할 수 있어요.</p>';
      return;
    }
    const parts = selectedDate.split('-');
    const yy = parts[0], mm = Number(parts[1]), dd = Number(parts[2]);
    const list = state.entries[selectedDate] || [];

    let rowsHtml = list.map(e => {
      const cat = CATS.find(c => c.key === e.category);
      const typeLabel = e.isIncome ? '수입' : (e.checked ? '완료' : '예정');
      const typeClass = e.isIncome ? 'mj-tag-income' : (e.checked ? 'mj-tag-done' : 'mj-tag-planned');
      const chkHtml = e.isIncome ? '' : ('<input type="checkbox" data-id="' + e.id + '" class="mj-chk-done" ' + (e.checked ? 'checked' : '') + '>');
      return (
        '<div class="mj-entry-row">' +
          '<span class="mj-chk-wrap">' + chkHtml + '</span>' +
          '<span class="mj-tag ' + typeClass + '">' + typeLabel + '</span>' +
          '<span class="mj-entry-cat" style="color:' + (cat ? cat.color : '#333') + '">' + (cat ? cat.label : '-') + '</span>' +
          '<span class="mj-entry-amt">' + (e.isIncome ? ('+' + formatWon(Math.abs(e.amount))) : (e.amount >= 0 ? ('-' + formatWon(e.amount)) : ('+' + formatWon(-e.amount)))) + '</span>' +
          '<span class="mj-entry-memo">' + escapeHtml(e.memo || '') + '</span>' +
          '<button class="mj-mini-btn" data-edit="' + e.id + '">수정</button>' +
          '<button class="mj-mini-btn danger" data-del="' + e.id + '">삭제</button>' +
        '</div>'
      );
    }).join('') || '<p class="mj-hint">아직 기록이 없어요.</p>';

    panel.innerHTML =
      '<div class="mj-day-panel-head">' +
        '<h3>' + yy + '년 ' + mm + '월 ' + dd + '일</h3>' +
        '<button class="mj-btn-add" id="mjAddEntryBtn">' + (entryFormVisible ? '닫기' : '+ 기록 추가') + '</button>' +
      '</div>' +
      '<div class="mj-entry-list">' + rowsHtml + '</div>' +
      '<div id="mjEntryFormWrap"></div>';

    document.getElementById('mjAddEntryBtn').onclick = () => {
      entryFormVisible = !entryFormVisible;
      editingEntryId = null;
      entryFormType = 'expense';
      renderDayPanel();
    };

    panel.querySelectorAll('.mj-chk-done').forEach(cb => {
      cb.onchange = () => {
        const id = cb.dataset.id;
        const arr = state.entries[selectedDate];
        const ent = arr.find(x => x.id === id);
        if (ent) { ent.checked = cb.checked; saveState(); renderCapitalCard(); renderJars(); renderCalendar(); }
      };
    });
    panel.querySelectorAll('[data-del]').forEach(btn => {
      btn.onclick = () => {
        if (!confirm('이 기록을 삭제할까요?')) return;
        const id = btn.dataset.del;
        state.entries[selectedDate] = state.entries[selectedDate].filter(x => x.id !== id);
        saveState(); renderCapitalCard(); renderJars(); renderCalendar(); renderDayPanel();
      };
    });
    panel.querySelectorAll('[data-edit]').forEach(btn => {
      btn.onclick = () => {
        editingEntryId = btn.dataset.edit;
        entryFormVisible = true;
        const ent = state.entries[selectedDate].find(x => x.id === editingEntryId);
        entryFormType = ent.isIncome ? 'income' : 'expense';
        renderDayPanel();
      };
    });

    if (entryFormVisible) renderEntryForm();
  }

  function renderEntryForm(){
    const wrap = document.getElementById('mjEntryFormWrap');
    if (!wrap) return;
    let editing = null;
    if (editingEntryId) editing = (state.entries[selectedDate] || []).find(x => x.id === editingEntryId);
    const isIncome = entryFormType === 'income';

    wrap.innerHTML =
      '<div class="mj-entry-form">' +
        '<div class="mj-seg">' +
          '<button type="button" class="mj-seg-btn ' + (!isIncome ? 'active' : '') + '" data-type="expense">지출</button>' +
          '<button type="button" class="mj-seg-btn ' + (isIncome ? 'active' : '') + '" data-type="income">수입</button>' +
        '</div>' +
        '<div class="mj-cat-seg" id="mjCatSeg">' +
          CATS.map(c => '<button type="button" class="mj-cat-btn" data-cat="' + c.key + '" style="--dc:' + c.color + '">' + c.label + '</button>').join('') +
        '</div>' +
        '<input type="text" inputmode="numeric" class="mj-amt-input" id="mjEntAmount" placeholder="금액 (지출은 마이너스도 가능: 환급·차감)" value="' + (editing ? fmtPlainSigned(editing.amount) : '') + '">' +
        '<input type="text" id="mjEntMemo" placeholder="메모 (예: 월세, 당근판매 등)" value="' + (editing ? escapeHtml(editing.memo || '') : '') + '">' +
        (!isIncome ? '<label class="mj-done-check"><input type="checkbox" id="mjEntChecked" ' + (editing ? (editing.checked ? 'checked' : '') : 'checked') + '> 이미 지출 완료했어요</label>' : '') +
        '<div class="mj-form-actions"><button class="mj-btn-save" id="mjSaveEntryBtn">' + (editing ? '수정 저장' : '저장') + '</button></div>' +
      '</div>';

    let selectedCat = editing ? editing.category : 'fixedcost';
    bindSignedAmtInput('mjEntAmount');
    function markCatButtons(){
      wrap.querySelectorAll('.mj-cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === selectedCat));
    }
    markCatButtons();
    wrap.querySelectorAll('.mj-cat-btn').forEach(b => {
      b.onclick = () => { selectedCat = b.dataset.cat; markCatButtons(); };
    });
    wrap.querySelectorAll('.mj-seg-btn').forEach(b => {
      b.onclick = () => { entryFormType = b.dataset.type; renderEntryForm(); };
    });

    document.getElementById('mjSaveEntryBtn').onclick = () => {
      const amt = getSignedAmt('mjEntAmount');
      const memo = document.getElementById('mjEntMemo').value.trim();
      const isInc = entryFormType === 'income';
      if (isNaN(amt)) { alert('금액을 입력해주세요.'); return; }
      if (isInc && amt <= 0) { alert('수입 금액은 0보다 커야 해요.'); return; }
      const checkedBox = document.getElementById('mjEntChecked');
      const checkedVal = isInc ? true : (checkedBox ? checkedBox.checked : true);

      if (!state.entries[selectedDate]) state.entries[selectedDate] = [];
      if (editingEntryId) {
        const ent = state.entries[selectedDate].find(x => x.id === editingEntryId);
        ent.isIncome = isInc; ent.category = selectedCat; ent.amount = amt; ent.memo = memo; ent.checked = checkedVal;
      } else {
        state.entries[selectedDate].push({ id: uid(), isIncome: isInc, category: selectedCat, amount: amt, memo: memo, checked: checkedVal });
      }
      editingEntryId = null;
      entryFormVisible = false;
      saveState();
      renderCapitalCard(); renderJars(); renderCalendar(); renderDayPanel();
    };
  }

  /* ---------- 초기화 ---------- */
  document.getElementById('mjResetBtn').onclick = async () => {
    if (!confirm('모든 기록과 설정이 삭제돼요. 계속할까요?')) return;
    const today = new Date();
    state = { incomeSettings: {}, capital: null, entries: {}, view: { y: today.getFullYear(), m: today.getMonth() } };
    incomeFormOpen = true;
    capitalFormOpen = true;
    selectedDate = null;
    await saveState();
    renderCapitalCard(); renderIncomeCard(); renderJars(); renderCalendar(); renderDayPanel();
  };

  /* ---------- 초기 실행 ---------- */
  (async function init(){
    state = await loadState();
    if (!state.entries) state.entries = {};
    if (!state.incomeSettings) state.incomeSettings = {};
    if (!state.view) { const t = new Date(); state.view = { y: t.getFullYear(), m: t.getMonth() }; }
    incomeFormOpen = !activeSettingForYM(ymOf(state.view.y, state.view.m));
    capitalFormOpen = !state.capital;
    renderCapitalCard();
    renderIncomeCard();
    renderJars();
    renderCalendar();
    renderDayPanel();
  })();
})();
</script>
